{% extends 'base.html' %}

{% block title %}Open a Kiosk // Marketplace{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-4 flex justify-center">
    <div class="max-w-xl w-full bg-white p-10 shadow-[0_10px_30px_rgba(0,0,0,0.03)] border-t-[5px] border-clay">
        
        <div class="mb-8">
            <a href="/dashboard" class="font-ui text-xs font-semibold text-stone-400 no-underline">&larr; Back to Merchant Hub</a>
            <h1 class="font-ui text-3xl font-normal lowercase tracking-tight m-0 text-dark-oak mt-2">open a new kiosk.</h1>
            <p class="font-serif italic text-sm text-stone-500 mt-1">Configure your storefront link, WhatsApp intake, and branding.</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">Kiosk Name</label>
                    <input type="text" name="name" id="name" required 
                           placeholder="e.g. Plan All About Essentials"
                           class="w-full p-3.5 border border-[#eee] bg-[#fafafa] font-ui text-xs text-dark-oak outline-none focus:border-clay">
                </div>

                <div>
                    <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">Store Link Slug</label>
                    <div class="flex items-center border border-[#eee] bg-[#fafafa] focus-within:border-clay px-3">
                        <span class="font-ui text-xs text-stone-400 select-none">marketplace.com/</span>
                        <input type="text" name="slug" id="slug" 
                               placeholder="essentials"
                               class="w-full py-3.5 px-1 bg-transparent outline-none font-ui text-xs font-semibold text-dark-oak">
                    </div>
                </div>
            </div>

            <div>
                <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">WhatsApp Number for Customer Orders</label>
                <input type="text" name="whatsapp_number" required 
                       placeholder="e.g. 08012345678"
                       class="w-full p-3.5 border border-[#eee] bg-[#fafafa] font-ui text-xs text-dark-oak outline-none focus:border-clay">
            </div>

            <div>
                <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">Tagline / Bio</label>
                <input type="text" name="bio" placeholder="Top quality home and lifestyle essentials delivered fast."
                       class="w-full p-3.5 border border-[#eee] bg-[#fafafa] font-serif text-xs text-dark-oak outline-none focus:border-clay">
            </div>

            <!-- Visual Media (Cloudinary Uploads) -->
            <div class="space-y-3 pt-2 border-t border-stone-100">
                <span class="font-ui text-[0.65rem] font-bold uppercase tracking-wider text-dark-oak block">Branding Assets (Optional)</span>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <div>
                        <label class="block font-ui text-[0.6rem] font-semibold uppercase text-stone-500 mb-1">Logo</label>
                        <input type="file" name="logo" accept="image/*" class="font-ui text-[0.65rem]">
                    </div>
                    <div>
                        <label class="block font-ui text-[0.6rem] font-semibold uppercase text-stone-500 mb-1">Hero Banner</label>
                        <input type="file" name="hero_image" accept="image/*" class="font-ui text-[0.65rem]">
                    </div>
                    <div>
                        <label class="block font-ui text-[0.6rem] font-semibold uppercase text-stone-500 mb-1">Background</label>
                        <input type="file" name="background_image" accept="image/*" class="font-ui text-[0.65rem]">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-clay w-full py-4 text-center block font-ui font-semibold text-sm">
                LAUNCH STOREFRONT &rarr;
            </button>
        </form>
    </div>
</div>

<script>
    const nameInput = document.getElementById('name');
    const slugInput = document.getElementById('slug');
    nameInput.addEventListener('input', () => {
        slugInput.value = nameInput.value.toLowerCase().replace(/[^a-z0-9]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
    });
</script>
{% endblock %}
