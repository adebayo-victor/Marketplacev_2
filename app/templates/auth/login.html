{% extends 'base.html' %}

{% block title %}Log In // Marketplace{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-10 md:p-12 shadow-[0_10px_30px_rgba(0,0,0,0.03)] border-t-[5px] border-clay">
        
        <div class="mb-8">
            <h1 class="font-ui text-3xl font-normal lowercase tracking-tight m-0 text-dark-oak">log in.</h1>
            <p class="font-serif italic text-sm text-stone-500 mt-1">Manage your active storefronts and customer orders.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-6">
            <div>
                <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">Username or Email</label>
                <input type="text" name="login_input" required 
                       placeholder="username or email@domain.com"
                       class="w-full p-3.5 border border-[#eee] bg-[#fafafa] font-ui text-xs text-dark-oak outline-none focus:border-clay focus:bg-white transition">
            </div>

            <!-- Password with Show/Hide Toggle -->
            <div>
                <label class="block font-ui text-[0.65rem] font-semibold uppercase tracking-[1px] text-clay mb-2">Password</label>
                <div class="relative flex items-center">
                    <input type="password" name="password" id="loginPassword" required 
                           placeholder="••••••••"
                           class="w-full p-3.5 pr-12 border border-[#eee] bg-[#fafafa] font-ui text-xs text-dark-oak outline-none focus:border-clay focus:bg-white transition">
                    <button type="button" onclick="togglePassword('loginPassword', 'eyeIcon')" 
                            class="absolute right-3 text-stone-400 hover:text-dark-oak focus:outline-none p-1">
                        <span id="eyeIcon" class="font-ui text-[11px] font-bold uppercase tracking-wider text-clay">Show</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between font-ui text-[0.7rem]">
                <label class="flex items-center text-stone-600 cursor-pointer">
                    <input type="checkbox" name="remember" class="accent-clay mr-2">
                    Remember session
                </label>
            </div>

            <button type="submit" class="btn-oak w-full text-center block">
                ACCESS DASHBOARD &rarr;
            </button>
        </form>

        <div class="text-center mt-8 pt-6 border-t border-stone-100 font-ui text-[0.7rem] text-stone-500">
            Need a storefront? 
            <a href="{{ url_for('auth.register') }}" class="text-clay font-semibold hover:underline ml-1">Open a new kiosk</a>
        </div>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const input = document.getElementById(inputId);
    const label = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        label.innerText = 'Hide';
    } else {
        input.type = 'password';
        label.innerText = 'Show';
    }
}
</script>
{% endblock %}
